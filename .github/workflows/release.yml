name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./scripts/test.sh
      - name: Package Apple Silicon app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export VERSION="${RELEASE_TAG#v}"
          ./scripts/package-app.sh
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
            --verify-tag --prerelease --title "Token Viewer $RELEASE_TAG" \
            --notes-file .github/RELEASE_NOTES.md
